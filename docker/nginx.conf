# Mirrors GitHub project pages: the site lives under /partfolio/ (see SITE_BASE in astro.config.ts).
server {
    listen 8080;
    server_name _;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; frame-ancestors 'none'" always;

    location = / {
        return 302 /partfolio/;
    }

    location /partfolio/_astro/ {
        alias /usr/share/nginx/html/_astro/;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /partfolio/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri.html $uri/index.html =404;
        error_page 404 /partfolio/404.html;
    }
}
